org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Suppress compileSdk warning from third-party libs that use Groovy build.gradle
android.suppressUnsupportedCompileSdk=35
# React Native
reactNativeArchitectures=arm64-v8a
hermesEnabled=true
newArchEnabled=false
# react-native-screens needs this to locate RN in non-standard layout (node_modules in frontend/)
react.node_modules_dir=../frontend/node_modules
