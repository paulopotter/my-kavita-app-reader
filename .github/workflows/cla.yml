name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    name: CLA Check
    runs-on: ubuntu-latest
    steps:
      # Own fork of contributor-assistant/github-action (upstream archived 2026-03, floating
      # `v2` tag no longer resolves). Pinned to the exact tag; v2.6.1 is the last upstream release.
      - uses: paulopotter/CLA-Assistant-GitHub-Action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token with repo scope — add as repository secret
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'CLA.en.md'
          branch: main
          allowlist: paulopotter,bot*,dependabot,github-actions*
          # Message shown in PR when CLA is not signed
          signed-commit-message: >
            All contributors have signed the CLA. ✅
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge this PR,
            please sign our [Contributor License Agreement](CLA.en.md)
            by commenting:

            > I have read the CLA and agree to its terms.
