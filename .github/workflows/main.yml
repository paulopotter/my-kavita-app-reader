name: Main

on:
  push:
    branches: [main]

jobs:
  # Placeholder: uncomment when tests exist
  # test:
  #   name: Full Test Suite
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Kotlin tests
  #       working-directory: android
  #       run: ./gradlew test
  #     - name: JS tests
  #       working-directory: frontend
  #       run: yarn install --frozen-lockfile && yarn test

  tag:
    name: Generate Tag
    runs-on: ubuntu-latest
    # needs: [test]  # uncomment when test job is active
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read component versions
        id: versions
        run: |
          KOTLIN_VER=$(grep -oP '(?<=versionName = ").*(?=")' android/app/build.gradle.kts 2>/dev/null || echo "")
          RN_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "")
          echo "kotlin=$KOTLIN_VER" >> "$GITHUB_OUTPUT"
          echo "rn=$RN_VER" >> "$GITHUB_OUTPUT"

      - name: Generate datetime tag
        id: datetag
        run: |
          BASE=$(date -u '+%Y.%m.%d')
          # Find next available sequence for today (avoids collisions on same-day releases)
          N=1
          while git rev-parse "${BASE}.${N}" >/dev/null 2>&1; do
            N=$((N + 1))
          done
          echo "tag=${BASE}.${N}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          TAG="${{ steps.datetag.outputs.tag }}"
          KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
          RN_VER="${{ steps.versions.outputs.rn }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag \
            -a "$TAG" \
            -m "release: $TAG" \
            -m "kotlin: $KOTLIN_VER" \
            -m "rn: $RN_VER"
          git push origin "$TAG"
