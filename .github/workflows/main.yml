name: Main

on:
  push:
    branches: [main]

jobs:
  # Placeholder: uncomment when tests exist
  # test:
  #   name: Full Test Suite
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Kotlin tests
  #       working-directory: android
  #       run: ./gradlew test
  #     - name: JS tests
  #       working-directory: frontend
  #       run: yarn install --frozen-lockfile && yarn test

  # This only covers a commit landing on main OUTSIDE the PR flow (e.g. a hotfix pushed
  # directly with [Unreleased] already filled in by hand). A PR merge triggers the tag via
  # pr-merge.yml's update-changelog job calling release-tag.yml directly instead — see the comment
  # there for why waiting on this push to fire is unreliable for that path.
  check-unreleased:
    name: Check for unreleased changelog content
    # Skip when the push was made by the bot itself (version bump / changelog commit) —
    # otherwise this fires again after release-tag.yml's own commit and either finds an
    # already-empty [Unreleased] (no-op) or races a second tag for the same content.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      has_content: ${{ steps.check.outputs.has_content }}
    steps:
      - uses: actions/checkout@v7

      - name: Check [Unreleased] section
        id: check
        run: |
          # Extract content inside [Unreleased] section (excluding HTML comments)
          CONTENT=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md \
            | grep -v '^[[:space:]]*$' \
            | grep -v '^<!--' \
            | grep -v '^-->' \
            | head -1)

          if [ -n "$CONTENT" ]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
            echo "Unreleased content found — will trigger tag"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "No unreleased content — skipping tag"
          fi

  tag:
    name: Generate Tag
    needs: check-unreleased
    if: needs.check-unreleased.outputs.has_content == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-tag.yml
    secrets: inherit
