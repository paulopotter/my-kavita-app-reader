name: PR Checks (code)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'policy-pending.json'
      - 'latest.json'

jobs:
  # ─── Checks (open/update only) ──────────────────────────────────────────────

  validate-ota:
    name: Validate OTA files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check if OTA files changed
        id: ota_changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          if echo "$FILES" | grep -qE "^(policy-pending\.json|latest\.json)$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate OTA files
        if: steps.ota_changed.outputs.changed == 'true'
        run: bash scripts/validate-ota.sh

  test-kotlin:
    name: Kotlin tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Create android/node_modules symlink
        run: ln -s "$(pwd)/frontend/node_modules" android/node_modules
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Run tests + verify coverage floor
        working-directory: android
        run: ./gradlew test koverXmlReport koverVerify
      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage
          path: android/build/reports/kover/report.xml
          retention-days: 7

  test-js:
    name: JS tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run tests + verify coverage floor
        working-directory: frontend
        run: yarn test:coverage
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: js-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  lint-kotlin:
    name: Lint Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run ktlint
        working-directory: android
        run: ./gradlew ktlintCheck

  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        working-directory: frontend
        run: yarn lint

  build-apk:
    name: Build APK (verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      # - name: Build debug APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleDebug

  build-bundle:
    name: Build JS Bundle (verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      # - name: Install dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      # - name: Build bundle
      #   working-directory: frontend
      #   run: yarn bundle
