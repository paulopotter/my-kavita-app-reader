name: PR Checks (code)

# No `paths:` filter here on purpose: paths: evaluates only the current push's own diff, not
# the PR's accumulated diff against main — so a PR with an early commit touching android/
# followed by doc-only commits would stop running these checks on later pushes, even though
# the code change is still sitting there unvalidated. Instead this always fires, and
# detect-changes decides — from the full origin/main...HEAD diff — whether the rest of the
# jobs actually run. Once a PR has touched android/ or frontend/ even once, every subsequent
# push keeps validating it, no matter what that specific push touches.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  detect-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.diff.outputs.has_code }}
      has_ota: ${{ steps.diff.outputs.has_ota }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff PR against base
        id: diff
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          HAS_CODE=false
          HAS_OTA=false
          while IFS= read -r f; do
            case "$f" in
              android/*|frontend/*) HAS_CODE=true ;;
            esac
            case "$f" in
              policy-pending.json|latest.json) HAS_OTA=true ;;
            esac
          done <<< "$FILES"
          echo "has_code=$HAS_CODE" >> "$GITHUB_OUTPUT"
          echo "has_ota=$HAS_OTA" >> "$GITHUB_OUTPUT"

  # ─── Checks (open/update only) ──────────────────────────────────────────────

  validate-ota:
    name: Validate OTA files
    needs: detect-changes
    if: needs.detect-changes.outputs.has_ota == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OTA files
        run: bash scripts/validate-ota.sh

  test-kotlin:
    name: Kotlin tests + coverage
    needs: detect-changes
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Create android/node_modules symlink
        run: ln -s "$(pwd)/frontend/node_modules" android/node_modules
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Run tests + verify coverage floor
        working-directory: android
        run: ./gradlew test koverXmlReport koverVerify
      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage
          path: android/build/reports/kover/report.xml
          retention-days: 7

  test-js:
    name: JS tests + coverage
    needs: detect-changes
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run tests + verify coverage floor
        working-directory: frontend
        run: yarn test:coverage
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: js-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  lint-kotlin:
    name: Lint Kotlin
    needs: detect-changes
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Run ktlint
        working-directory: android
        run: ./gradlew ktlintCheck

  lint-ts:
    name: Lint TypeScript
    needs: detect-changes
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        working-directory: frontend
        run: yarn lint

  build-apk:
    name: Build APK (verification)
    needs: detect-changes
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      # - name: Build debug APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleDebug

  build-bundle:
    name: Build JS Bundle (verification)
    needs: detect-changes
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      # - name: Install dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      # - name: Build bundle
      #   working-directory: frontend
      #   run: yarn bundle
