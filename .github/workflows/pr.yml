name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

jobs:
  # ─── Checks (open/update only) ──────────────────────────────────────────────

  lint-kotlin:
    name: Lint Kotlin
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      # - name: Run ktlint
      #   working-directory: android
      #   run: ./gradlew ktlintCheck

  lint-ts:
    name: Lint TypeScript
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      # - name: Install dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      # - name: Run ESLint
      #   working-directory: frontend
      #   run: yarn lint

  build-apk:
    name: Build APK (verification)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      # - name: Build debug APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleDebug

  build-bundle:
    name: Build JS Bundle (verification)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      # - name: Install dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      # - name: Build bundle
      #   working-directory: frontend
      #   run: yarn bundle

  # ─── RC build (triggered by /rc comment, maintainer only) ───────────────────

  rc-build:
    name: Build RC APK
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/rc' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.sha);
            core.setOutput('branch', pr.data.head.ref);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Read versions
        id: versions
        run: |
          KOTLIN_VER=$(grep -oP '(?<=versionName = ").*(?=")' android/app/build.gradle.kts 2>/dev/null || echo "0.0.0")
          RN_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "0.0.0")
          echo "kotlin=$KOTLIN_VER" >> "$GITHUB_OUTPUT"
          echo "rn=$RN_VER" >> "$GITHUB_OUTPUT"

      - name: Stamp RC suffix on versionName
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          SHA="${{ steps.pr.outputs.ref }}"
          SHORT_SHA="${SHA:0:7}"
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.versions.outputs.kotlin }}-rc.pr${PR_NUM}.${SHORT_SHA}\"/" \
            android/app/build.gradle.kts

      # Placeholder: uncomment when build is stable in CI
      # - name: Install JS dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      #
      # - name: Build JS bundle
      #   working-directory: frontend
      #   run: yarn react-native bundle --platform android --dev false \
      #     --entry-file index.tsx \
      #     --bundle-output ../android/app/src/main/assets/index.android.bundle
      #
      # - name: Build debug APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleDebug

      - name: Upload RC APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rc-pr${{ github.event.issue.number }}-${{ steps.pr.outputs.ref }}
          # path: android/app/build/outputs/apk/debug/app-debug.apk
          path: android/local.properties  # placeholder — troca pelo APK quando o build estiver ativo
          retention-days: 7

      - name: Comment on PR with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const kotlinVer = '${{ steps.versions.outputs.kotlin }}';
            const rnVer = '${{ steps.versions.outputs.rn }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### RC Build gerado ✅\n\n` +
                    `| | Versão |\n|---|---|\n` +
                    `| Kotlin | \`${kotlinVer}-rc\` |\n` +
                    `| RN | \`${rnVer}\` |\n\n` +
                    `Artefato disponível por 7 dias: [Ver no Actions](${runUrl})`
            });

  # ─── Changelog on merge ──────────────────────────────────────────────────────

  update-changelog:
    name: Update CHANGELOG on merge
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN }}

      - name: Extract changelog draft from PR body
        id: draft
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract lines after "## Changelog" until next "## " section
          DRAFT=$(printf '%s' "$PR_BODY" \
            | awk '/^## Changelog/{found=1; next} found && /^## /{exit} found && /^<!--/{exit} found && /^[[:space:]]*$/{next} found{print}')

          if [ -z "$DRAFT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR body has no changelog content — skipping"
            exit 0
          fi

          # Check if [Unreleased] already has content in CHANGELOG.md
          UNRELEASED=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md \
            | grep -v '^[[:space:]]*$' | grep -v '^<!--' | grep -v '^-->' | head -1)

          if [ -n "$UNRELEASED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG already has unreleased content — skipping to avoid duplication"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "draft<<HEREDOC"
            echo "$DRAFT"
            echo "HEREDOC"
          } >> "$GITHUB_OUTPUT"

      - name: Format and translate via Gemini
        id: gemini
        if: steps.draft.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGELOG_DRAFT: ${{ steps.draft.outputs.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PROMPT=$(cat <<'PROMPT_EOF'
You are a technical changelog editor for a Kotlin + React Native Android app called "My Manga Reader".
Take the raw changelog draft below and return ONLY a formatted entry in this exact structure — no extra text, no markdown fences, no explanation:

[pt-BR]
- bullet in Brazilian Portuguese

[en]
- bullet in English

Rules:
- Translate to both pt-BR and en
- User-facing language: what changed, not how
- Past tense verbs (pt-BR: "Adicionado", "Corrigido", "Melhorado"; en: "Added", "Fixed", "Improved")
- No section headers like "### Added" — only the [pt-BR] and [en] blocks
- Max 8 bullets per language
- If input is already in both languages, keep and improve them
PROMPT_EOF
)
          FULL_PROMPT="${PROMPT}

PR: ${PR_TITLE}

Draft:
${CHANGELOG_DRAFT}"

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text "$FULL_PROMPT" '{contents:[{parts:[{text:$text}]}]}')")

          FORMATTED=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$FORMATTED" ]; then
            echo "Gemini returned empty — using raw draft as fallback"
            FORMATTED="$CHANGELOG_DRAFT"
          fi

          {
            echo "entry<<HEREDOC"
            echo "$FORMATTED"
            echo "HEREDOC"
          } >> "$GITHUB_OUTPUT"

      - name: Insert into CHANGELOG.md
        if: steps.draft.outputs.skip == 'false'
        env:
          ENTRY: ${{ steps.gemini.outputs.entry }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYEOF'
import os, sys, re

entry    = os.environ['ENTRY']
pr_num   = os.environ['PR_NUMBER']
pr_title = os.environ['PR_TITLE']

with open('CHANGELOG.md', 'r') as f:
    content = f.read()

# Find the [Unreleased] section and insert after its closing comment (if any)
unreleased_match = re.search(r'## \[Unreleased\]', content)
if not unreleased_match:
    print("ERROR: [Unreleased] marker not found", file=sys.stderr)
    sys.exit(1)

insert_at = unreleased_match.end()

# Skip past any HTML comment block
comment_match = re.search(r'-->', content[insert_at:])
if comment_match:
    insert_at += comment_match.end()

# Skip trailing whitespace/newlines after the marker
while insert_at < len(content) and content[insert_at] in ('\n', '\r', ' '):
    insert_at += 1

block = f"\n{entry}\n"
new_content = content[:insert_at] + block + content[insert_at:]

with open('CHANGELOG.md', 'w') as f:
    f.write(new_content)

print(f"Inserted changelog entry for PR #{pr_num}")
PYEOF

      - name: Commit changelog
        if: steps.draft.outputs.skip == 'false'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: atualiza changelog via PR #${PR_NUMBER} — ${PR_TITLE}"
          git push origin main
