name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

jobs:
  # ─── Checks (open/update only) ──────────────────────────────────────────────

  validate-ota:
    name: Validate OTA files
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      contains(github.event.pull_request.changed_files > 0 && 'true', 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if OTA files changed
        id: ota_changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          if echo "$FILES" | grep -qE "^(policy-pending\.json|latest\.json)$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate OTA files
        if: steps.ota_changed.outputs.changed == 'true'
        run: bash scripts/validate-ota.sh

  test-kotlin:
    name: Kotlin tests + coverage
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Create android/node_modules symlink
        run: ln -s "$(pwd)/frontend/node_modules" android/node_modules
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Run tests + verify coverage floor
        working-directory: android
        run: ./gradlew test koverXmlReport koverVerify
      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage
          path: android/build/reports/kover/report.xml
          retention-days: 7

  test-js:
    name: JS tests + coverage
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run tests + verify coverage floor
        working-directory: frontend
        run: yarn test:coverage
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  lint-kotlin:
    name: Lint Kotlin
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      # - name: Run ktlint
      #   working-directory: android
      #   run: ./gradlew ktlintCheck

  lint-ts:
    name: Lint TypeScript
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      # - name: Install dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      # - name: Run ESLint
      #   working-directory: frontend
      #   run: yarn lint

  build-apk:
    name: Build APK (verification)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      # - name: Build debug APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleDebug

  build-bundle:
    name: Build JS Bundle (verification)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      # - name: Install dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      # - name: Build bundle
      #   working-directory: frontend
      #   run: yarn bundle

  # ─── RC build (triggered by /rc comment, maintainer only) ───────────────────

  rc-build:
    name: Build RC APK
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/rc' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.sha);
            core.setOutput('branch', pr.data.head.ref);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Create android/node_modules symlink
        run: ln -s "$(pwd)/frontend/node_modules" android/node_modules

      - name: Read versions
        id: versions
        run: |
          KOTLIN_VER=$(grep -oP '(?<=versionName = ").*(?=")' android/app/build.gradle.kts 2>/dev/null || echo "0.0.0")
          RN_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "0.0.0")
          echo "kotlin=$KOTLIN_VER" >> "$GITHUB_OUTPUT"
          echo "rn=$RN_VER" >> "$GITHUB_OUTPUT"

      - name: Stamp RC suffix on versionName
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          SHA="${{ steps.pr.outputs.ref }}"
          SHORT_SHA="${SHA:0:7}"
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.versions.outputs.kotlin }}-rc.pr${PR_NUM}.${SHORT_SHA}\"/" \
            android/app/build.gradle.kts

      # Placeholder: uncomment when build is stable in CI
      # - name: Install JS dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      #
      # - name: Build JS bundle
      #   working-directory: frontend
      #   run: yarn react-native bundle --platform android --dev false \
      #     --entry-file index.tsx \
      #     --bundle-output ../android/app/src/main/assets/index.android.bundle
      #
      # - name: Build debug APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleDebug

      - name: Upload RC APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rc-pr${{ github.event.issue.number }}-${{ steps.pr.outputs.ref }}
          # path: android/app/build/outputs/apk/debug/app-debug.apk
          path: android/local.properties  # placeholder — troca pelo APK quando o build estiver ativo
          retention-days: 7

      - name: Comment on PR with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const kotlinVer = '${{ steps.versions.outputs.kotlin }}';
            const rnVer = '${{ steps.versions.outputs.rn }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### RC Build gerado ✅\n\n` +
                    `| | Versão |\n|---|---|\n` +
                    `| Kotlin | \`${kotlinVer}-rc\` |\n` +
                    `| RN | \`${rnVer}\` |\n\n` +
                    `Artefato disponível por 7 dias: [Ver no Actions](${runUrl})`
            });

  # ─── Changelog on merge ──────────────────────────────────────────────────────

  update-changelog:
    name: Update CHANGELOG on merge
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN }}

      - name: Extract changelog sections from PR body
        id: draft
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          OUTPUT_ANDROID: /tmp/android-draft.txt
          OUTPUT_FRONTEND: /tmp/frontend-draft.txt
        run: |
          # Check if [Unreleased] already has content
          UNRELEASED=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md \
            | grep -v '^[[:space:]]*$' | grep -v '^<!--' | grep -v '^-->' | head -1)
          if [ -n "$UNRELEASED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG already has unreleased content, skipping"
            exit 0
          fi

          # Extract android/ and frontend/ sections from PR body
          if python3 scripts/ci/extract-pr-changelog.py; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changelog content in PR body, skipping"
          fi

      - name: Read component versions
        id: versions
        if: steps.draft.outputs.skip == 'false'
        run: |
          KOTLIN=$(grep -oP '(?<=versionName = ").*(?=")' android/app/build.gradle.kts 2>/dev/null || echo "0.1.0")
          RN=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "0.1.0")
          echo "kotlin=$KOTLIN" >> "$GITHUB_OUTPUT"
          echo "rn=$RN" >> "$GITHUB_OUTPUT"

      - name: Format via Gemini
        id: gemini
        if: steps.draft.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          KOTLIN_CURRENT: ${{ steps.versions.outputs.kotlin }}
          KOTLIN_NEXT: ${{ steps.versions.outputs.kotlin }}
          RN_CURRENT: ${{ steps.versions.outputs.rn }}
          RN_NEXT: ${{ steps.versions.outputs.rn }}
          OUTPUT_USER: /tmp/user-entry.md
          OUTPUT_TAG: /tmp/tag-entry.md
        run: |
          ANDROID_DRAFT=$(cat /tmp/android-draft.txt 2>/dev/null || echo "")
          FRONTEND_DRAFT=$(cat /tmp/frontend-draft.txt 2>/dev/null || echo "")
          export ANDROID_DRAFT FRONTEND_DRAFT
          chmod +x scripts/ci/gemini-format-changelog.sh
          bash scripts/ci/gemini-format-changelog.sh

      - name: Insert into CHANGELOG.md
        if: steps.draft.outputs.skip == 'false'
        env:
          USER_ENTRY_FILE: /tmp/user-entry.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci/insert-changelog-entry.py

      - name: Commit changelog
        if: steps.draft.outputs.skip == 'false'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: atualiza changelog via PR #${PR_NUMBER}"
          git push origin main
