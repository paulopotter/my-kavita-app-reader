name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]'

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Read component versions
        id: versions
        run: |
          KOTLIN_VER=$(grep -oP '(?<=versionName = ").*(?=")' android/app/build.gradle.kts 2>/dev/null || echo "n/a")
          RN_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "n/a")
          echo "kotlin=$KOTLIN_VER" >> "$GITHUB_OUTPUT"
          echo "rn=$RN_VER"        >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build JS bundle
        working-directory: frontend
        run: |
          mkdir -p ../android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.tsx \
            --bundle-output ../android/app/src/main/assets/index.android.bundle

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
        # Note: assembleDebug produces an installable APK signed with the debug key.
        # Switch to assembleRelease + signing config when a keystore is set up.

      - name: Rename APK with version
        run: |
          TAG="${{ github.ref_name }}"
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "my-manga-reader-${TAG}.apk"

      # Placeholder: uncomment when OTA (backlog 010) is implemented
      # - name: Write latest.json
      #   run: |
      #     TAG="${{ github.ref_name }}"
      #     RN_VER="${{ steps.versions.outputs.rn }}"
      #     KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
      #     cat > latest.json <<EOF
      #     {
      #       "bundleVersion": "$RN_VER",
      #       "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/bundle.js",
      #       "minAppVersion": "$TAG",
      #       "minKotlinVersion": "$KOTLIN_VER"
      #     }
      #     EOF

      - name: Extract changelog for this release
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
          RN_VER="${{ steps.versions.outputs.rn }}"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo "**Kotlin:** \`$KOTLIN_VER\` | **RN:** \`$RN_VER\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            my-manga-reader-${{ github.ref_name }}.apk
