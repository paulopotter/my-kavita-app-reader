name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*'

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Placeholder: uncomment when android/app/build.gradle.kts exists
      # - name: Build release APK
      #   working-directory: android
      #   run: ./gradlew :app:assembleRelease

      # Placeholder: uncomment when frontend/package.json exists
      # - name: Install JS dependencies
      #   working-directory: frontend
      #   run: yarn install --frozen-lockfile
      #
      # - name: Build JS bundle
      #   working-directory: frontend
      #   run: yarn bundle

      # Placeholder: uncomment when bundle output path is defined
      # - name: Write latest.json
      #   run: |
      #     TAG="${{ github.ref_name }}"
      #     RN_VER=$(node -p "require('./frontend/package.json').version")
      #     cat > latest.json <<EOF
      #     {
      #       "bundleVersion": "$RN_VER",
      #       "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/bundle.js"
      #     }
      #     EOF

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          # Extract block between this tag's header and the next
          NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          KOTLIN_VER=$(grep -oP '(?<=versionName = ").*(?=")' android/app/build.gradle.kts 2>/dev/null || echo "n/a")
          RN_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "n/a")
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo "**Kotlin:** $KOTLIN_VER | **RN:** $RN_VER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          # Placeholder: add files when artifacts exist
          # files: |
          #   android/app/build/outputs/apk/release/app-release.apk
          #   frontend/dist/bundle.js
          #   latest.json

